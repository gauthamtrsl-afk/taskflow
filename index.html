<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TaskFlow — a simple, fast, client-side task manager." />
  <title>TaskFlow — Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </span>
      <span class="brand-name">TaskFlow</span>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="searchInput" class="search-input" placeholder="Search tasks…" aria-label="Search tasks" />
    </div>

    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button id="addTaskBtn" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-label">Add Task</span>
      </button>
    </div>
  </header>

  <main class="app-main">
    <section class="stats-grid" aria-label="Task statistics">
      <div class="stat-card stat-total">
        <div class="stat-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>
        <div class="stat-body">
          <span class="stat-label">Total</span>
          <span class="stat-value" id="statTotal">0</span>
        </div>
      </div>
      <div class="stat-card stat-active">
        <div class="stat-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
        <div class="stat-body">
          <span class="stat-label">Active</span>
          <span class="stat-value" id="statActive">0</span>
        </div>
      </div>
      <div class="stat-card stat-completed">
        <div class="stat-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
        </div>
        <div class="stat-body">
          <span class="stat-label">Completed</span>
          <span class="stat-value" id="statCompleted">0</span>
        </div>
      </div>
      <div class="stat-card stat-overdue">
        <div class="stat-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
        </div>
        <div class="stat-body">
          <span class="stat-label">Overdue</span>
          <span class="stat-value" id="statOverdue">0</span>
        </div>
      </div>
    </section>

    <section class="toolbar" aria-label="Task filters and sorting">
      <div class="filter-tabs" role="tablist" aria-label="Filter tasks">
        <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">All <span class="count" id="countAll">0</span></button>
        <button class="filter-tab" data-filter="active" role="tab" aria-selected="false">Active <span class="count" id="countActive">0</span></button>
        <button class="filter-tab" data-filter="completed" role="tab" aria-selected="false">Completed <span class="count" id="countCompleted">0</span></button>
        <button class="filter-tab" data-filter="overdue" role="tab" aria-selected="false">Overdue <span class="count" id="countOverdue">0</span></button>
      </div>

      <div class="toolbar-controls">
        <select id="sortSelect" class="select" aria-label="Sort tasks">
          <option value="created-desc">Newest first</option>
          <option value="created-asc">Oldest first</option>
          <option value="due-asc">Due date (soonest)</option>
          <option value="due-desc">Due date (latest)</option>
          <option value="priority">Priority (high→low)</option>
          <option value="title">Title (A→Z)</option>
        </select>
        <select id="categoryFilter" class="select" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
      </div>
    </section>

    <section id="taskList" class="task-grid" aria-live="polite" aria-label="Task list"></section>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-illustration" aria-hidden="true">
        <svg width="88" height="88" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>
      </div>
      <h2>No tasks yet</h2>
      <p>Add your first task to get started.</p>
      <button id="emptyAddBtn" class="btn btn-primary">Add Task</button>
    </div>
  </main>

  <footer class="app-footer">
    <span id="footerCount" class="footer-count">0 tasks</span>
    <div class="footer-actions">
      <button id="exportBtn" class="btn btn-ghost btn-sm">Export JSON</button>
      <button id="importBtn" class="btn btn-ghost btn-sm">Import JSON</button>
      <button id="clearCompletedBtn" class="btn btn-ghost btn-sm">Clear completed</button>
    </div>
  </footer>

  <input type="file" id="importFile" accept="application/json" hidden />

  <!-- Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Task</h2>
        <button id="modalClose" class="icon-btn" aria-label="Close dialog">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="taskForm" class="modal-body" novalidate>
        <input type="hidden" id="taskId" />
        <div class="field">
          <label for="titleInput">Title <span class="required">*</span></label>
          <input type="text" id="titleInput" class="input" maxlength="120" required placeholder="What needs to be done?" />
          <span class="field-error" id="titleError"></span>
        </div>
        <div class="field">
          <label for="descInput">Description</label>
          <textarea id="descInput" class="input textarea" maxlength="500" rows="3" placeholder="Add details (optional)"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="prioritySelect">Priority</label>
            <select id="prioritySelect" class="select">
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="field">
            <label for="dueDateInput">Due date</label>
            <input type="date" id="dueDateInput" class="input" />
          </div>
        </div>
        <div class="field">
          <label for="categorySelect">Category</label>
          <select id="categorySelect" class="select">
            <option value="General">General</option>
          </select>
          <input type="text" id="newCategoryInput" class="input hidden" placeholder="New category name" maxlength="40" />
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelBtn" class="btn btn-ghost">Cancel</button>
          <button type="submit" id="saveBtn" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
